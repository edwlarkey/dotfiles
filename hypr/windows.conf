# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrule {
  name = windowrule-1
  suppress_event = maximize
  opacity = 0.97 0.9
  match:class = .*
}


# Just dash of opacity by default

# Fix some dragging issues with XWayland
windowrule {
  name = windowrule-2
  no_focus = on
  match:class = ^$
  match:title = ^$
  match:xwayland = 1
  match:float = 1
  match:fullscreen = 0
  match:pin = 0
}


# App-specific tweaks

# Browser types
windowrule {
  name = windowrule-3
  tag = +chromium-based-browser
  match:class = ([cC]hrom(e|ium)|[bB]rave-browser|Microsoft-edge|Vivaldi-stable)
}

windowrule {
  name = windowrule-4
  tag = +firefox-based-browser
  match:class = (Firefox|zen|librewolf)
}


# Force chromium-based browsers into a tile to deal with --app bug
windowrule {
  name = windowrule-5
  tile = on
  opacity = 1 0.97
  match:tag = chromium-based-browser
}


# Only a subtle opacity change, but not for video sites
windowrule {
  name = windowrule-6
  opacity = 1 0.97
  match:tag = firefox-based-browser
}


# Some video sites should never have opacity applied to them
windowrule {
  name = windowrule-7
  opacity = 1.0 1.0
  match:initial_title = (youtube\.com_/|app\.zoom\.us_/wc/home)
}


# Steam
windowrule {
  name = windowrule-8
  float = on
  opacity = 1 1
  idle_inhibit = fullscreen
  match:class = steam
}

windowrule {
  name = windowrule-9
  center = on
  size = 1100 700
  match:class = steam
  match:title = Steam
}

windowrule {
  name = windowrule-10
  size = 460 800
  match:class = steam
  match:title = Friends List
}


# utilities
windowrule {
  name = windowrule-11
  float = on
  match:class = pavucontrol
}

windowrule {
  name = windowrule-12
  float = on
  match:class = mpv
}
windowrule = match:class mpv, no_dim on, no_shadow on, opacity 1.0 override



